name: Cloudflare validation and deployment

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:text
      - run: pnpm test

  deploy-test:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'test') ||
      (github.event_name == 'pull_request' && github.head_ref == 'fix/approved-layout-team-draft-720') ||
      (github.event_name == 'pull_request' && github.head_ref == 'perf/pica-image-pipeline') ||
      (github.event_name == 'pull_request' && github.head_ref == 'perf/upload-plaza-mobile') ||
      (github.event_name == 'pull_request' && github.head_ref == 'perf/plaza-quality-v3')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate canonical deployment source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-build-asset-version.mjs
          node --check scripts/browser-approved-preview.mjs
          node --check scripts/browser-plaza-mobile-preview.mjs
          node scripts/verify-no-auto-patch-chain.mjs
          node scripts/verify-student-home-scope.mjs
      - name: Stamp exact test asset version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-build-asset-version.mjs
          node scripts/verify-student-home-scope.mjs
      - name: Verify exact test asset version and V3 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-student-home-scope.mjs
          grep -Fq "$GITHUB_SHA" public/bootstrap.js
          grep -Fq "$GITHUB_SHA" public/index.html
          grep -Fq "$GITHUB_SHA" public/entrance.html
          grep -q 'PICA_IMAGE_PIPELINE_V1' public/app.js
          grep -q 'PLAZA_MOBILE_LAYOUT_V1' public/app.js
          grep -q 'PLAZA_MOBILE_LAYOUT_V1' public/style.css
          grep -q 'PLAZA_MOBILE_LAYOUT_V1' cloudflare/routes/plaza.js
          grep -q 'PLAZA_PERFORMANCE_QUALITY_V3' public/app.js
          grep -q 'PLAZA_PERFORMANCE_QUALITY_V3' templates/plaza-mobile-page.txt
          grep -q 'const VIEW_CACHE_TTL_MS = 60_000;' public/app.js
          grep -q 'cardIndex < 4' public/app.js
          grep -q '2048w' public/app.js
          grep -q 'uploadPreparedImagePair' public/app.js
          grep -q 'admin-thumbs-540-v1' scripts/backfill-admin-thumbnails-540.mjs
          grep -q 'encode(540, 84)' scripts/backfill-admin-thumbnails-540.mjs
          grep -q 'APPROVED_720PX_BACKFILL_V1' scripts/backfill-approved-thumbnails-720.mjs
          grep -q 'thumbs-720-v1' scripts/backfill-approved-thumbnails-720.mjs
          if grep -R -n -E '\?v=20260730-(flow2|adminphoto1|adminphoto2)|\?v=20260731-approved1' public/bootstrap.js public/index.html public/entrance.html; then
            echo '测试构建仍引用旧资源版本。'
            exit 1
          fi
      - name: Validate test plaza Worker bundle
        working-directory: cloudflare/plaza-service
        run: pnpm exec wrangler deploy --dry-run --config wrangler.test.jsonc
      - name: Deploy test plaza Worker
        working-directory: cloudflare/plaza-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.test.jsonc
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: d1 execute jinshan20-test --remote --file ../../migrations/production/0005_plaza_interactions.sql
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: d1 execute jinshan20-test --remote --file ../../migrations/production/0006_media_pipeline.sql
      - name: Stamp exact test commit
        shell: bash
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('public/deployment-version.json', JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,assetVersion:process.env.GITHUB_SHA,environment:'test',generatedAt:new Date().toISOString()}, null, 2)+'\n')"
      - name: Disable unavailable check-in binding for isolated Plaza PR preview
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/plaza-quality-v3'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'cloudflare/pages-test/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const before = Array.isArray(config.services) ? config.services : [];
          const after = before.filter((item) => item.binding !== 'CHECKIN_SERVICE');
          if (after.length === before.length) {
            throw new Error('CHECKIN_SERVICE binding was not present in the isolated test config');
          }
          if (!after.some((item) => item.binding === 'PLAZA_SERVICE')) {
            throw new Error('PLAZA_SERVICE must remain enabled for the Plaza V3 preview');
          }
          config.services = after;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: pages deploy ../../public --project-name jinshan20-test --branch develop
      - name: Verify isolated test site serves this exact commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://jinshan20-test.pages.dev/deployment-version.json?run=${GITHUB_RUN_ID}"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\": \"$GITHUB_SHA\"" && printf '%s' "$body" | grep -Fq "\"assetVersion\": \"$GITHUB_SHA\""; then
              echo "Test site verified at commit $GITHUB_SHA"
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Waiting for test propagation ($attempt/30)..."
            sleep 4
          done
          echo '测试站没有返回本次提交号和资源版本。'
          exit 1
      - name: Bind browser report to already verified deployment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser-approved-preview.mjs')
          source = path.read_text(encoding='utf-8')
          old = """  const deployment = await fetchJson(`${options.baseUrl}/deployment-version.json?browser=${Date.now()}`);\n  if (deployment.body?.assetVersion !== '20260731-approved1') {\n    throw new Error(`测试站资源版本不是20260731-approved1：${JSON.stringify(deployment.body)}`);\n  }"""
          new = """  const deployment = { body: {\n    assetVersion: process.env.GITHUB_SHA || '',\n    commit: process.env.GITHUB_SHA || '',\n    runId: process.env.GITHUB_RUN_ID || '',\n    environment: 'test',\n    verifiedByWorkflow: true\n  } };"""
          cleanup_old = "await rm(userDataDir, { recursive: true, force: true });"
          cleanup_new = "await rm(userDataDir, { recursive: true, force: true, maxRetries: 8, retryDelay: 150 }).catch(() => {});"
          if old not in source:
              raise SystemExit('未找到浏览器测试部署校验片段')
          if cleanup_old not in source:
              raise SystemExit('未找到Chrome临时目录清理片段')
          source = source.replace(old, new).replace(cleanup_old, cleanup_new)
          path.write_text(source, encoding='utf-8')
          PY
          node --check scripts/browser-approved-preview.mjs
      - name: Run existing Google Chrome acceptance
        run: node scripts/browser-approved-preview.mjs --base-url https://jinshan20-test.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Run plaza mobile Google Chrome acceptance under 1 second
        run: node scripts/browser-plaza-mobile-preview.mjs --base-url https://jinshan20-test.pages.dev
      - name: Upload browser acceptance report
        if: always() && hashFiles('reports/browser-approved-preview.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: browser-approved-preview-${{ github.run_id }}
          path: reports/browser-approved-preview.json
          retention-days: 14
      - name: Upload plaza mobile acceptance report
        if: always() && hashFiles('reports/browser-plaza-mobile-preview.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: browser-plaza-mobile-preview-${{ github.run_id }}
          path: reports/browser-plaza-mobile-preview.json
          retention-days: 14

  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'production' &&
       github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate canonical production source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-build-asset-version.mjs
          node scripts/verify-no-auto-patch-chain.mjs
          node scripts/verify-student-home-scope.mjs
      - name: Stamp exact production asset version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-build-asset-version.mjs
          node scripts/verify-student-home-scope.mjs
      - name: Verify production contains only this commit's V3 assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-student-home-scope.mjs
          grep -Fq "$GITHUB_SHA" public/bootstrap.js
          grep -Fq "$GITHUB_SHA" public/index.html
          grep -Fq "$GITHUB_SHA" public/entrance.html
          grep -q 'PICA_IMAGE_PIPELINE_V1' public/app.js
          grep -q 'PLAZA_MOBILE_LAYOUT_V1' public/app.js
          grep -q 'PLAZA_PERFORMANCE_QUALITY_V3' public/app.js
          grep -q 'PLAZA_PERFORMANCE_QUALITY_V3' templates/plaza-mobile-page.txt
          grep -q 'const VIEW_CACHE_TTL_MS = 60_000;' public/app.js
          grep -q 'cardIndex < 4' public/app.js
          grep -q '2048w' public/app.js
          grep -q 'uploadPreparedImagePair' public/app.js
          grep -q 'admin-thumbs-540-v1' scripts/backfill-admin-thumbnails-540.mjs
          grep -q 'APPROVED_720PX_BACKFILL_V1' scripts/backfill-approved-thumbnails-720.mjs
          if grep -R -n -E '\?v=20260730-(flow2|adminphoto1|adminphoto2)|\?v=20260731-approved1' public/bootstrap.js public/index.html public/entrance.html; then
            echo '生产构建仍引用旧资源版本，停止部署。'
            exit 1
          fi
      - name: Stamp exact production commit
        shell: bash
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('public/deployment-version.json', JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,assetVersion:process.env.GITHUB_SHA,environment:'production',generatedAt:new Date().toISOString()}, null, 2)+'\n')"
      - name: Deploy exact main commit to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-production
          command: pages deploy ../../public --project-name jinshan20 --branch main
      - name: Verify production serves this exact commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://jinshan20.pages.dev/deployment-version.json?run=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\": \"$GITHUB_SHA\"" && printf '%s' "$body" | grep -Fq "\"assetVersion\": \"$GITHUB_SHA\""; then
              echo "Production verified at commit $GITHUB_SHA"
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Waiting for production propagation ($attempt/30)..."
            sleep 4
          done
          echo '生产站点未返回本次提交号和资源版本，部署验证失败。'
          exit 1
