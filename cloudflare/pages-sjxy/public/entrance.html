    <style>@font-face{font-family:'Zhi Mang Xing';font-style:normal;font-weight:400;font-display:swap;src:url('/zhi-mang-xing-title.woff2') format('woff2')}</style>
    <style>
        :root {
            --primary-glow: #e0b0ff;
            --secondary-glow: #ff758f;
            --accent-glow: #ffdf00;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100%;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #07070a;
            -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
            touch-action: pan-x pan-y;
        }
        body { min-height: 100vh; min-height: 100dvh; }

        /* ==========================================
           1. 极简电影级流星开场
           ========================================== */
        #cinematic-intro {
            position: fixed; inset: 0; z-index: 10000;
            background: #07070a;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .meteor-track {
            position: absolute; top: 50%; left: 50%; width: 250vw; height: 2px;
            transform: translate(-50%, -50%) rotate(45deg); pointer-events: none;
        }

        .elegant-meteor {
            position: absolute; top: 0; right: 100%; width: 80vw; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), #ffffff);
            animation: meteorStrike 2.8s cubic-bezier(0.3, 0, 0.2, 1) forwards;
            filter: drop-shadow(0 0 15px #00e5ff) drop-shadow(0 0 35px #ffffff);
        }

        .elegant-meteor::after {
            content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 50px 20px #00e5ff;
        }

        @keyframes meteorStrike {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateX(350vw); opacity: 0; }
        }

        /* ==========================================
           2. 高级流体背景 & 暗角遮罩
           ========================================== */
        .ambient-canvas {
            position: absolute; inset: 0; z-index: 1; opacity: 0; filter: blur(90px);
            transition: opacity 2.5s ease 0.2s;
        }

        .orb { position: absolute; border-radius: 50%; animation: float 20s infinite alternate ease-in-out; }
        .orb-1 { width: 60vw; height: 60vw; background: var(--primary-glow); top: -10%; left: -10%; opacity: 0.7; }
        .orb-2 { width: 50vw; height: 50vw; background: var(--secondary-glow); bottom: -10%; right: -10%; opacity: 0.6; animation-delay: -5s; }
        .orb-3 { width: 70vw; height: 40vw; background: var(--accent-glow); top: 30%; left: 20%; opacity: 0.5; animation-delay: -10s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, 10vh) scale(1.1); } }

        .vignette-overlay {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at center, transparent 20%, #07070a 100%);
            opacity: 0; transition: opacity 2.5s ease 0.2s;
        }

        .mouse-glow {
            position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            border-radius: 50%; pointer-events: none; z-index: 3;
            transform: translate(-50%, -50%); transition: opacity 0.3s; opacity: 0;
        }

        /* ==========================================
           3. 优雅的文字排版
           ========================================== */
        .ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(20px);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s;
            box-sizing: border-box;
        }

        .main-title {
            font-family: 'Zhi Mang Xing', cursive, serif; font-size: 5.5rem; color: #ffffff;
            margin: 0 0 10px 0; font-weight: normal; letter-spacing: 6px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: linear-gradient(to bottom, #ffffff, #ffe8c4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap;
        }

        .subtitle {
            font-size: 1.5rem; color: rgba(255,255,255,0.9); letter-spacing: 35px;
            text-transform: uppercase; margin-bottom: 55px; text-shadow: 0 2px 10px rgba(0,0,0,0.4); margin-right: -35px;
        }

        @media (max-width: 900px) {
            .main-title { font-size: 3rem; letter-spacing: 2px; }
            .subtitle { font-size: 1rem; letter-spacing: 20px; margin-right: -20px;}
        }

        /* ==========================================
           4. 极简毛玻璃登录框
           ========================================== */
        .glass-panel {
            width: 360px; padding: 40px; background: rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05); text-align: center;
        }

        .login-heading { font-size: 1.6rem; color: #fff; margin-bottom: 25px; font-weight: 500; letter-spacing: 12px; text-indent: 12px; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .input-box { width: 100%; box-sizing: border-box; padding: 16px 20px; margin-bottom: 22px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s; letter-spacing: 1px;}
        .input-box::placeholder { color: rgba(255, 255, 255, 0.5); font-weight: 300;}
        .input-box:focus { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 15px rgba(255,255,255,0.15); }

        .btn-submit { width: 100%; padding: 16px; margin-top: 5px; background: #ffffff; color: #000000; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; letter-spacing: 8px; cursor: pointer; transition: all 0.3s; text-indent: 8px; }
        .login-error { min-height: 22px; margin: -8px 0 10px; color: #ffe3a8; font-size: 14px; line-height: 1.5; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.3); }

        @media (max-width: 600px) {
            .ui-layer {
                justify-content: flex-start;
                padding: max(9vh, 54px) 20px max(24px, env(safe-area-inset-bottom));
            }
            .main-title {
                width: 100%;
                font-size: clamp(2rem, 9vw, 2.5rem);
                line-height: 1.14;
                letter-spacing: 1px;
                text-align: center;
                white-space: nowrap;
            }
            .subtitle {
                font-size: .9rem;
                letter-spacing: 16px;
                margin: 14px -16px 30px 0;
            }
            .glass-panel {
                width: min(100%, 360px);
                padding: 25px 22px 24px;
                border-radius: 18px;
            }
            .login-heading {
                font-size: 1.25rem;
                margin-bottom: 19px;
                letter-spacing: 9px;
                text-indent: 9px;
            }
            .input-box {
                min-height: 52px;
                padding: 13px 16px;
                margin-bottom: 14px;
                font-size: 16px;
            }
            .btn-submit {
                min-height: 52px;
                padding: 13px;
                margin-top: 2px;
                font-size: 1rem;
            }
            .mouse-glow { display: none; }
            .ambient-canvas { filter: blur(65px); }
            .orb-1 { width: 110vw; height: 110vw; }
            .orb-2 { width: 95vw; height: 95vw; }
            .orb-3 { width: 120vw; height: 75vw; left: 0; }
        }

        @media (max-width: 360px), (max-height: 680px) {
            .ui-layer { padding-top: max(5vh, 28px); }
            .main-title { font-size: clamp(1.9rem, 8.7vw, 2.25rem); }
            .subtitle { margin-bottom: 20px; }
            .glass-panel { padding: 20px 18px; }
            .login-heading { margin-bottom: 14px; }
            .input-box { min-height: 48px; margin-bottom: 11px; }
            .btn-submit { min-height: 48px; }
        }

        /* ==========================================
           5. 深度强化星空与多尺寸流星
           ========================================== */
        .bg-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 2s ease 0.5s; }

        /* 静态星星（强化大小层次与光晕） */
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle infinite alternate; }
        @keyframes twinkle {
            0% { opacity: 0.15; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 8px rgba(255,255,255,0.9); }
        }

        /* 动态漂浮星尘粒子 */
        .floating-particle {
            position: absolute; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255,255,255,0.5); opacity: 0;
            will-change: transform, opacity;
        }

        /* 背景划过的流星（支持多尺寸动态调整） */
        .bg-shooting-star {
            position: absolute; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95));
            opacity: 0; filter: drop-shadow(0 0 4px #ffffff);
            animation: bgMeteorStrike linear forwards;
        }
        .bg-shooting-star::after {
            content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 3px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 6px #fff;
        }
        @keyframes bgMeteorStrike {
            0% { transform: rotate(45deg) translateX(0); opacity: 0; }
            10% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: rotate(45deg) translateX(110vw); opacity: 0; }
        }
        @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
            .orb, .mouse-glow, .floating-particle, .bg-shooting-star { display: none !important; }
            .ambient-canvas, .vignette-overlay, .ui-layer, .bg-stars { transition: none !important; }
            .ambient-canvas { filter: none !important; }
            .star { animation: none !important; box-shadow: none !important; }
        }
        .reduced-effects .orb,
        .reduced-effects .mouse-glow,
        .reduced-effects .floating-particle,
        .reduced-effects .bg-shooting-star { display: none !important; }
        .reduced-effects .ambient-canvas,
        .reduced-effects .vignette-overlay,
        .reduced-effects .ui-layer,
        .reduced-effects .bg-stars { transition: none !important; }
        .reduced-effects .ambient-canvas { filter: none !important; }
        .reduced-effects .star { animation: none !important; box-shadow: none !important; }
    </style>

  <script>
﻿document.addEventListener('DOMContentLoaded', () => {
            // iOS WeChat can ignore the viewport scale lock while a gesture is active.
            document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
            document.addEventListener('gesturechange', (event) => event.preventDefault(), { passive: false });
            document.addEventListener('gestureend', (event) => event.preventDefault(), { passive: false });
            document.addEventListener('touchmove', (event) => {
                if (event.touches.length > 1) event.preventDefault();
            }, { passive: false });

            const intro = document.getElementById('cinematic-intro');
            const ambient = document.getElementById('ambient');
            const vignette = document.getElementById('vignette');
            const uiLayer = document.getElementById('ui-layer');
            const bgStars = document.getElementById('bg-stars');
            const glow = document.getElementById('glow');
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const userAgent = navigator.userAgent || '';
            const constrainedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
                || matchMedia('(hover: none)').matches
                || matchMedia('(pointer: coarse)').matches
                || /iP(?:hone|ad|od)|MicroMessenger|MQQBrowser|QQ\//i.test(userAgent);
            if (constrainedMotion) document.documentElement.classList.add('reduced-effects');
            let loginPending = false;

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (loginPending) return;
                loginPending = true;
                const button = loginForm.querySelector('.btn-submit');
                button.disabled = true;
                button.textContent = '登录中';
                loginError.textContent = '';
                // Warm the authenticated landing document alongside login, never during entrance first paint.
                window.__START_HOME_DOCUMENT_PREFETCH__?.();
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                try {
                    const values = Object.fromEntries(new FormData(loginForm));
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify(values),
                        signal: controller.signal
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || '登录失败');
                    try {
                        localStorage.setItem('token', result.token);
                        localStorage.setItem('user', JSON.stringify(result.user));
                    } catch {
                        // Login still works through the HttpOnly cookie in restricted WebViews.
                    }
                    // A stalled speculative home request must never hold the real navigation open.
                    await window.__SETTLE_HOME_DOCUMENT_PREFETCH__?.();
                    /* LOGIN_BOOTSTRAP_HANDOFF_V2 */
                    try {
                        const bootstrap = result.bootstrap;
                        if (bootstrap?.ok
                            && bootstrap.user?.id
                            && bootstrap.user.id === result.user?.id
                            && bootstrap.dashboard) {
                            sessionStorage.setItem("jinshan20.loginBootstrap.v2", JSON.stringify({
                                savedAt: Date.now(),
                                userId: result.user.id,
                                data: bootstrap
                            }));
                        } else {
                            sessionStorage.removeItem("jinshan20.loginBootstrap.v2");
                        }
                    } catch {}
                    location.replace('/');
                } catch (error) {
                    loginError.textContent = error.name === 'AbortError' ? '登录请求超时，请检查网络后重试。' : error.message;
                    loginPending = false;
                    button.disabled = false;
                    button.textContent = '确 认';
                } finally {
                    clearTimeout(timeout);
                }
            });
            /* STRICT_P95_LOGIN_READY_V4 */
            // Login controls are part of the critical path. Keep the cinematic layer decorative, never blocking input.
            intro.style.pointerEvents = 'none';
            intro.style.zIndex = '5';
            uiLayer.style.transition = 'none';
            uiLayer.style.opacity = '1';
            uiLayer.style.transform = 'translateY(0)';
            requestAnimationFrame(() => {
                ambient.style.opacity = '1';
                vignette.style.opacity = '1';
                bgStars.style.opacity = '1';
                glow.style.opacity = '1';
                setTimeout(() => { intro.style.opacity = '0'; }, 250);
            });

            if (!constrainedMotion) document.addEventListener('mousemove', (e) => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });

            // 1. 生成高密度、有大小层次的静态繁星 (数量180颗，大小扩大到1px - 4.5px)
            for(let i = 0; i < (constrainedMotion ? 36 : 180); i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';

                // 制造大小不一的视觉空间感 (有微小星、中等星、耀眼大星)
                let size = Math.random() * 3.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                star.style.animationDuration = (Math.random() * 3.5 + 1.5) + 's';
                star.style.animationDelay = Math.random() * 3 + 's';
                bgStars.appendChild(star);
            }

            // 2. 生成缓慢漂浮的环境星尘粒子
            for(let i = 0; i < (constrainedMotion ? 0 : 70); i++) {
                let particle = document.createElement('div');
                particle.className = 'floating-particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';

                let size = Math.random() * 3.5 + 1.5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                bgStars.appendChild(particle);

                const xMove = (Math.random() - 0.5) * 180;
                const yMove = (Math.random() - 0.5) * 180;

                particle.animate([
                    { transform: 'translate(0,0)', opacity: 0 },
                    { opacity: Math.random() * 0.6 + 0.2, offset: 0.5 },
                    { transform: `translate(${xMove}px, ${yMove}px)`, opacity: 0 }
                ], {
                    duration: Math.random() * 12000 + 8000,
                    easing: 'linear',
                    iterations: Infinity,
                    delay: Math.random() * 5000
                });
            }

            // 3. 增强版动态流星雨 (数量增多、大小与速度各异)
            function createBgMeteor() {
                const meteor = document.createElement('div');
                meteor.className = 'bg-shooting-star';

                const startX = (Math.random() - 0.2) * window.innerWidth;
                const startY = (Math.random() - 0.5) * window.innerHeight;
                meteor.style.left = startX + 'px';
                meteor.style.top = startY + 'px';

                // 随机流星尺寸（长度 60px 到 220px 错落有致）
                meteor.style.width = (Math.random() * 160 + 60) + 'px';

                // 随机飞行速度（1.0秒 到 2.2秒 产生快慢错落）
                const duration = Math.random() * 1.2 + 1.0;
                meteor.style.animationDuration = duration + 's';

                bgStars.appendChild(meteor);
                setTimeout(() => meteor.remove(), duration * 1000);
            }

            // 缩短触发间隔，大幅增加流星出现频率
            if (!constrainedMotion) setTimeout(() => {
                setInterval(() => {
                    // 提高生成触发概率到 85%
                    if (Math.random() > 0.15) {
                        createBgMeteor();
                    }
                }, 600); // 频率缩短至 600ms，让流星雨更频繁
            }, 1000);
        });

  </script>

    <!-- HOME_DOCUMENT_PREFETCH_V2: bounded cache warmup; never reuse a stalled request -->
    <script>
    (() => {
      let controller = null;
      let request = Promise.resolve();
      let settled = true;
      const start = () => {
        if (controller) return;
        controller = new AbortController();
        settled = false;
        const timeout = setTimeout(() => controller.abort(), 1200);
        request = fetch('/', { credentials: 'same-origin', cache: 'default', signal: controller.signal })
          .then((response) => response.ok ? response.arrayBuffer() : null)
          .catch(() => null)
          .finally(() => { settled = true; clearTimeout(timeout); });
      };
      addEventListener('input', start, { once: true, capture: true });
      addEventListener('pointerdown', start, { once: true, capture: true });
      addEventListener('load', () => setTimeout(start, 1500), { once: true });
      window.__START_HOME_DOCUMENT_PREFETCH__ = start;
      window.__SETTLE_HOME_DOCUMENT_PREFETCH__ = async () => {
        if (controller && !settled) controller.abort();
        await request;
      };
    })();
    </script>
